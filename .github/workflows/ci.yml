name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: JVM
            timeout: 45
          - platform: JS
            timeout: 60
    steps:
      - name: Check out reframe4s
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"

      - name: Read immutable Image pin
        id: image-pin
        run: |
          image_revision="$(node scripts/provider-pin.mjs image4s build.sbt)"
          echo "revision=$image_revision" >> "$GITHUB_OUTPUT"

      - name: Check out immutable image4s source
        uses: actions/checkout@v7.0.1
        with:
          repository: canardlapin/image4s
          ref: ${{ steps.image-pin.outputs.revision }}
          path: .ci/image4s

      - name: Read immutable Image provider pins
        id: image-provider-pins
        run: |
          spatial_revision="$(node scripts/provider-pin.mjs spatial4s build.sbt)"
          image_spatial_revision="$(node scripts/provider-pin.mjs spatial4s .ci/image4s/build.sbt)"
          if [ "$spatial_revision" != "$image_spatial_revision" ]; then
            echo "Spatial4s pin mismatch: reframe4s=$spatial_revision image4s=$image_spatial_revision" >&2
            exit 1
          fi
          locus_revision="$(node scripts/provider-pin.mjs locus4s .ci/image4s/build.sbt)"
          echo "spatial4s=$spatial_revision" >> "$GITHUB_OUTPUT"
          echo "locus4s=$locus_revision" >> "$GITHUB_OUTPUT"

      - name: Check out immutable spatial4s source
        uses: actions/checkout@v7.0.1
        with:
          repository: canardlapin/spatial4s
          ref: ${{ steps.image-provider-pins.outputs.spatial4s }}
          path: .ci/spatial4s

      - name: Check out immutable locus4s source
        uses: actions/checkout@v7.0.1
        with:
          repository: canardlapin/locus4s
          ref: ${{ steps.image-provider-pins.outputs.locus4s }}
          path: .ci/locus4s

      - name: Set up Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "22"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Verify contracts and ownership
        if: matrix.platform == 'JVM'
        env:
          IMAGE4S_ROOT: ${{ github.workspace }}/.ci/image4s
          SPATIAL4S_ROOT: ${{ github.workspace }}/.ci/spatial4s
          LOCUS4S_ROOT: ${{ github.workspace }}/.ci/locus4s
        run: |
          node scripts/verify-prd.mjs
          node scripts/verify-build-graph.mjs
          node scripts/verify-symbol-ownership.mjs
          python3 tools/registration/validate_real_world_registration_registry.py

      - name: Test validation tools
        if: matrix.platform == 'JVM'
        run: |
          node --test scripts/*.test.mjs
          python3 -m unittest discover -s tools -p 'test_datasets.py'

      - name: Compile and test ${{ matrix.platform }} modules sequentially
        run: sbt -J-Xmx4G -batch reframe4sTest${{ matrix.platform }}

      - name: Verify benchmark runners
        if: matrix.platform == 'JVM'
        run: sbt -J-Xmx4G -batch reframe4sTestRunners
